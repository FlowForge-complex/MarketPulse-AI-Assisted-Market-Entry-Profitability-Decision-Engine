name: CI Quality & Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  validate-and-test:
    name: Build, Lint, Typecheck, Security & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install types-PyYAML
          pip install -e .

      - name: Run Black Code Formatting Check
        run: black --check src/ tests/ run_pipeline.py

      - name: Run isort Import Sorting Check
        run: isort --check-only src/ tests/ run_pipeline.py

      - name: Run Flake8 Linter
        run: flake8 src/ tests/ run_pipeline.py

      - name: Run mypy Static Type Analysis
        run: python -m mypy --explicit-package-bases src/ tests/ run_pipeline.py

      - name: Run Bandit AST Security Scan
        run: bandit -r src/ -s B101,B311,B110 -f json -o bandit-report.json || bandit -r src/ -s B101,B311,B110

      - name: Run pip-audit Dependency Scan
        run: pip-audit -r requirements.txt

      - name: Run Pytest Test Suite with Coverage Gate (>= 90%)
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90

      - name: Execute Headless Decision Pipeline
        run: python run_pipeline.py --seed 42 --benchmark --headless

      - name: Upload Security & Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-and-coverage-reports
          path: |
            coverage.xml
            bandit-report.json
            data/benchmarks/benchmark_results.json
          retention-days: 7
