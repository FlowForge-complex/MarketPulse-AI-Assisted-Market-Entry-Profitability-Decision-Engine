version: '3.8'

services:
  # PostgreSQL Data Warehouse Service
  postgres:
    image: postgres:15-alpine
    container_name: marketpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketpulse_db
      POSTGRES_USER: marketpulse_user
      POSTGRES_PASSWORD: marketpulse_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse_user -d marketpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MarketPulse Decision Engine Pipeline
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketpulse_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=marketpulse_db
      - POSTGRES_USER=marketpulse_user
      - POSTGRES_PASSWORD=marketpulse_password
    volumes:
      - ./data:/app/data
      - ./screenshots:/app/screenshots
    command: ["python", "run_pipeline.py", "--seed", "42", "--benchmark"]

  # Interactive Streamlit Executive Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketpulse_dashboard
    depends_on:
      - pipeline
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  pgdata:
    driver: local
